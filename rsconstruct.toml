# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile compiled the assembly demos with gcc/ld, one .elf per source,
# keyed by directory. rsconstruct reproduces each variant:
#   src     .s  -> gcc -z noexecstack -no-pie   (one-shot assemble+link)
#   src_64  .S  -> gcc -static -m64 -nostdlib
#   src_no_c .s -> gcc -c then bare ld (no crt) -- needs the two-step wrapper
# src_32 was DO_SRC_32:=0 in the Makefile (off), so it is not built.
[processor.cc_single_file.src]
src_dirs = ["src"]
src_extensions = [".s"]
ldflags = ["-z", "noexecstack", "-no-pie"]

[processor.cc_single_file.src64]
src_dirs = ["src_64"]
src_extensions = [".S"]
cflags = ["-static", "-m64"]
ldflags = ["-static", "-m64", "-nostdlib"]

[processor.generator.src_no_c]
command = "scripts/asm_link_ld.py"
src_dirs = ["src_no_c"]
src_extensions = [".s"]
output_dir = "out"
output_extension = "elf"
batch = false
